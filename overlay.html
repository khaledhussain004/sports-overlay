<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Live Overlay Output</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: white; }
        
        /* ইমেজগুলো স্ক্রিনের যেকোনো জায়গায় মাউস দিয়ে ড্র্যাগ করার সুবিধার্থে */
        .custom-img { position: absolute; display: none; max-width: 250px; z-index: 5; border-radius: 5px; }
        #img1 { top: 40px; right: 40px; }
        #img2 { top: 300px; right: 40px; }

        /* প্রফেশনাল স্পোর্টস স্কোরবোর্ড */
        .scoreboard { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); background: rgba(15, 15, 15, 0.9); display: flex; align-items: center; font-weight: bold; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); border-bottom: 4px solid #00ea91; display: none; z-index: 10; overflow: hidden; }
        .team { padding: 12px 25px; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .score { background: #00ea91; color: black; padding: 12px 22px; font-size: 26px; min-width: 35px; text-align: center; }
        .time-period { padding: 10px 20px; background: #252525; font-size: 18px; text-align: center; min-width: 110px; border-left: 1px solid #444; border-right: 1px solid #444; }

        /* পেনাল্টি শ্যুটআউট */
        .shootout-panel { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); background: rgba(20,20,20,0.95); padding: 12px 25px; border-radius: 6px; display: none; gap: 25px; font-size: 16px; border: 1px solid #333; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #444; margin: 0 4px; border: 1px solid #222; }
        .dot.V { background: #00ea91; box-shadow: 0 0 8px #00ea91; }
        .dot.X { background: #ff4d4d; box-shadow: 0 0 8px #ff4d4d; }

        /* স্ক্রলিং নিউজ টিকার */
        .ticker-wrap { position: absolute; bottom: 0; left: 0; width: 100%; background: #ff0000; padding: 14px 0; overflow: hidden; white-space: nowrap; font-size: 24px; font-weight: bold; display: none; box-shadow: 0 -5px 15px rgba(0,0,0,0.4); z-index: 20; }
        .ticker-text { display: inline-block; animation: marquee 25s linear infinite; padding-left: 100%; }
        @keyframes marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

        /* স্কোয়াড / প্লেয়ার লিস্ট */
        .lineup-box { position: absolute; top: 180px; left: 40px; background: rgba(10,10,10,0.9); padding: 22px; border-radius: 8px; width: 280px; border-left: 6px solid #00ea91; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 8; }
        .lineup-box pre { margin: 0; font-size: 18px; font-family: inherit; line-height: 1.7; white-space: pre-line; color: #eee; }
    </style>
</head>
<body>

<img id="img1" class="custom-img" src="" alt="">
<img id="img2" class="custom-img" src="" alt="">

<div class="scoreboard" id="board">
    <div class="team" id="t_a">TEAM A</div>
    <div class="score" id="s_a">0</div>
    <div class="time-period">
        <div id="m_time">00:00</div>
        <div id="m_per" style="font-size:12px; color:#00ea91; margin-top:2px;">1st Half</div>
    </div>
    <div class="score" id="s_b">0</div>
    <div class="team" id="t_b">TEAM B</div>
</div>

<div class="shootout-panel" id="shootout">
    <div style="font-weight:bold; color:#00ea91;">A: <span id="dots_a"></span></div>
    <div style="font-size:12px; color:#888; letter-spacing:1px; font-weight:bold;">SHOOTOUT</div>
    <div style="font-weight:bold; color:#ff4d4d;">B: <span id="dots_b"></span></div>
</div>

<div class="lineup-box" id="lineup"><pre id="list_content"></pre></div>

<div class="ticker-wrap" id="ticker"><div class="ticker-text" id="tick_t"></div></div>

<script>
    const SUPABASE_URL = "https://exnedokvmwxhqcjsyvcq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4bmVkb2t2bXd4aHFjanN5dmNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTM2MzgsImV4cCI6MjA5NjIyOTYzOH0.D_-5dDNX58O-MnIWnAa1o0X_l84O4rxfh6GzyKzJWPA";
    const supabase = window.supabase.createClient(https://exnedokvmwxhqcjsyvcq.supabase.co, eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4bmVkb2t2bXd4aHFjanN5dmNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTM2MzgsImV4cCI6MjA5NjIyOTYzOH0.D_-5dDNX58O-MnIWnAa1o0X_l84O4rxfh6GzyKzJWPA);

    let timerInterval = null;
    let currentSeconds = 0;

    function parseTimeToSeconds(timeStr) {
        const parts = timeStr.split(':');
        return (parseInt(parts[0], 10) * 60) + parseInt(parts[1], 10);
    }

    function formatSecondsToTime(seconds) {
        const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        const secs = (seconds % 60).toString().padStart(2, '0');
        return `${mins}:${secs}`;
    }

    function startTimer() {
        if (timerInterval) return;
        timerInterval = setInterval(() => {
            currentSeconds++;
            document.getElementById('m_time').innerText = formatSecondsToTime(currentSeconds);
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    function renderOverlay(data) {
        if(data.img1_status === 'show' && data.img1_url) { document.getElementById('img1').src = data.img1_url; document.getElementById('img1').style.display = 'block'; } else { document.getElementById('img1').style.display = 'none'; }
        if(data.img2_status === 'show' && data.img2_url) { document.getElementById('img2').src = data.img2_url; document.getElementById('img2').style.display = 'block'; } else { document.getElementById('img2').style.display = 'none'; }

        if(data.period_status === 'show') {
            document.getElementById('board').style.display = 'flex';
            document.getElementById('t_a').innerText = data.team_a_name;
            document.getElementById('s_a').innerText = data.team_a_score;
            document.getElementById('t_b').innerText = data.team_b_name;
            document.getElementById('s_b').innerText = data.team_b_score;
            document.getElementById('m_per').innerText = data.match_period;
            
            currentSeconds = parseTimeToSeconds(data.match_time);
            document.getElementById('m_time').innerText = data.match_time;
            if(data.timer_status === 'run') { startTimer(); } else { pauseTimer(); }
        } else { document.getElementById('board').style.display = 'none'; pauseTimer(); }

        if(data.shootout_status === 'show' && data.shootout_data) {
            document.getElementById('shootout').style.display = 'flex';
            const shData = JSON.parse(data.shootout_data);
            document.getElementById('dots_a').innerHTML = shData.a.map(s => `<span class="dot ${s}"></span>`).join('');
            document.getElementById('dots_b').innerHTML = shData.b.map(s => `<span class="dot ${s}"></span>`).join('');
        } else { document.getElementById('shootout').style.display = 'none'; }

        if(data.ticker_status === 'show') { document.getElementById('ticker').style.display = 'block'; document.getElementById('tick_t').innerText = data.ticker_text; } else { document.getElementById('ticker').style.display = 'none'; }
        if(data.lineup_status === 'show') { document.getElementById('lineup').style.display = 'block'; document.getElementById('list_content').innerText = data.lineup_a; } else { document.getElementById('lineup').style.display = 'none'; }
    }

    async function init() {
        const { data } = await supabase.from('overlays').select('*').eq('id', 1).single();
        if(data) renderOverlay(data);
    }
    init();

    supabase.channel('sports-stream').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'overlays' }, payload => {
        renderOverlay(payload.new);
    }).subscribe();
</script>
</body>
</html>
