<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; color: white; background: transparent; }
        .score-board { font-size: 40px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="score-board">
        <span id="team_a">Team A</span>: <span id="score_a">0</span> | 
        <span id="team_b">Team B</span>: <span id="score_b">0</span>
    </div>

    <script>
        async function updateScore() {
            const res = await fetch('https://khaledhussain004.github.io/sports-overlay/data.json?t=' + new Date().getTime());
            const data = await res.json();
            document.getElementById('team_a').innerText = data.team_a;
            document.getElementById('score_a').innerText = data.score_a;
            document.getElementById('team_b').innerText = data.team_b;
            document.getElementById('score_b').innerText = data.score_b;
        }
        setInterval(updateScore, 2000); // প্রতি ২ সেকেন্ডে স্কোর রিফ্রেশ হবে
    </script>
</body>
</html>
