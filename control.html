<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROADCAST CONTROLLER SUITE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b1329; --panel: #1c2541; --accent: #3a86ff; --text: #f8fafc; --success: #38b000; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 90px; }
        h2 { text-align: center; color: #00b4d8; margin: 0 0 15px 0; font-size: 18px; text-transform: uppercase; }
        .tabs { display: flex; gap: 4px; margin-bottom: 15px; background: #111a36; padding: 4px; border-radius: 8px; overflow-x: auto; }
        .tab-btn { background: transparent; color: #a3b18a; border: none; padding: 12px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; flex: 1; text-align: center; white-space: nowrap; }
        .tab-btn.active { background: var(--accent); color: #fff; }
        .tab-content { display: none; background: var(--panel); padding: 15px; border-radius: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 12px; background: #0b1329; border: 1px solid #475569; border-radius: 6px; color: #fff; box-sizing: border-box; }
        .flex-group { display: flex; gap: 10px; }
        .flex-group > div { flex: 1; }
        .switch-group { display: flex; align-items: center; justify-content: space-between; background: #0b1329; padding: 12px; border-radius: 6px; border: 1px solid #1e293b; }
        .btn-container { position: fixed; bottom: 0; left: 0; width: 100%; background: #0b1329; padding: 12px; box-sizing: border-box; border-top: 1px solid #1e293b; }
        .save-btn { width: 100%; background: var(--success); color: white; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .status-bar { text-align: center; font-size: 12px; color: #00b4d8; font-weight: bold; margin-top: 6px; }
    </style>
</head>
<body>

    <h2>Broadcast Controller Suite</h2>
    <div class="tabs">
        <button type="button" class="tab-btn active" onclick="switchTab('score')">Score & Time</button>
        <button type="button" class="tab-btn" onclick="switchTab('squad')">Squad & Ticker</button>
    </div>

    <div id="tab-score" class="tab-content" style="display: block;">
        <div class="switch-group">
            <label style="color:#fff; font-weight:bold; margin:0;">Show Scoreboard</label>
            <input type="checkbox" id="show_scoreboard" checked>
        </div>
        <br>
        <div class="flex-group">
            <div class="form-group">
                <label>Team A Name</label>
                <input type="text" id="team_a" value="TEAM A">
            </div>
            <div class="form-group" style="max-width: 80px;">
                <label>Score A</label>
                <input type="number" id="score_a" value="0">
            </div>
        </div>
        <div class="flex-group">
            <div class="form-group">
                <label>Team B Name</label>
                <input type="text" id="team_b" value="TEAM B">
            </div>
            <div class="form-group" style="max-width: 80px;">
                <label>Score B</label>
                <input type="number" id="score_b" value="0">
            </div>
        </div>
        <div class="flex-group">
            <div class="form-group">
                <label>Match Time (MM:SS)</label>
                <input type="text" id="match_time" value="00:00">
            </div>
            <div class="form-group">
                <label>Period / Half</label>
                <input type="text" id="period" value="1st Half">
            </div>
        </div>
    </div>

    <div id="tab-squad" class="tab-content">
        <div class="switch-group">
            <label style="color:#fff; font-weight:bold; margin:0;">Show Squad Panel</label>
            <input type="checkbox" id="lineup_on">
        </div>
        <br>
        <div class="form-group">
            <label>Players (1 per line)</label>
            <textarea id="lineup_players" style="height:80px; color:white; background:#0b1329; width:100%;" placeholder="1. Player Name"></textarea>
        </div>
        <hr style="border-color:#475569;">
        <div class="form-group">
            <label>Scrolling Ticker Text</label>
            <input type="text" id="ticker_text">
        </div>
        <div class="switch-group">
            <label style="margin:0;">Ticker On/Off</label>
            <input type="checkbox" id="ticker_on">
        </div>
    </div>

    <div class="btn-container">
        <button type="button" class="save-btn" onclick="saveData()">SAVE & UPDATE OVERLAY</button>
        <div class="status-bar" id="status">Connecting to Supabase Cloud...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://exnedokvmwxhqcjsyvcq.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4bmVkb2t2bXd4aHFjanN5dmNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTM2MzgsImV4cCI6MjA5NjIyOTYzOH0.D_-5dDNX58O-MnIWnAa1o0X_l84O4rxfh6GzyKzJWPA";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function switchTab(tab) {
            document.querySelectorAll(".tab-content").forEach(el => el.style.display = "none");
            document.getElementById("tab-" + tab).style.display = "block";
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            event.currentTarget.classList.add("active");
        }

        async function loadData() {
            try {
                const { data, error } = await supabase.from('overlays').select('*').eq('id', 1).single();
                if (data) {
                    document.getElementById('show_scoreboard').checked = data.show_scoreboard ?? true;
                    document.getElementById('team_a').value = data.team_a || 'TEAM A';
                    document.getElementById('score_a').value = data.score_a ?? 0;
                    document.getElementById('team_b').value = data.team_b || 'TEAM B';
                    document.getElementById('score_b').value = data.score_b ?? 0;
                    document.getElementById('match_time').value = data.match_time || '00:00';
                    document.getElementById('period').value = data.period || '1st Half';
                    document.getElementById('lineup_on').checked = data.lineup_on ?? false;
                    document.getElementById('lineup_players').value = data.lineup_players || '';
                    document.getElementById('ticker_text').value = data.ticker_text || '';
                    document.getElementById('ticker_on').checked = data.ticker_on ?? false;
                    document.getElementById('status').innerText = "✓ Connected to Cloud!";
                    document.getElementById('status').style.color = "#38b000";
                } else {
                    document.getElementById('status').innerText = "No Row Found. Creating Data...";
                    await supabase.from('overlays').insert([{id: 1, team_a: 'TEAM A', team_b: 'TEAM B', score_a: 0, score_b: 0}]);
                    loadData();
                }
            } catch (e) { 
                document.getElementById('status').innerText = "Error syncing with cloud."; 
            }
        }

        async function saveData() {
            document.getElementById('status').innerText = "Saving data...";
            document.getElementById('status').style.color = "#3a86ff";
            const payload = {
                show_scoreboard: document.getElementById('show_scoreboard').checked,
                team_a: document.getElementById('team_a').value,
                score_a: document.getElementById('score_a').value.toString(),
                team_b: document.getElementById('team_b').value,
                score_b: document.getElementById('score_b').value.toString(),
                match_time: document.getElementById('match_time').value,
                period: document.getElementById('period').value,
                lineup_on: document.getElementById('lineup_on').checked,
                lineup_players: document.getElementById('lineup_players').value,
                ticker_text: document.getElementById('ticker_text').value,
                ticker_on: document.getElementById('ticker_on').checked
            };
            const { error } = await supabase.from('overlays').update(payload).eq('id', 1);
            if(!error) {
                document.getElementById('status').innerText = "✓ Updated Successfully!";
                document.getElementById('status').style.color = "#38b000";
            } else {
                document.getElementById('status').innerText = "Save Failed! Check cloud connectivity.";
                document.getElementById('status').style.color = "#ff3333";
            }
        }
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
