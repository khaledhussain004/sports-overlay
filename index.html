<!DOCTYPE html>
<html>
<body>
    <h2>Broadcast Controller</h2>
    <div id="status">Connecting to GitHub...</div>
    <script>
        const GITHUB_TOKEN = "Ghp_Vz014aiRNTPT2wUQAiqUBzWrdd860n0MTisd";
        const REPO_OWNER = "khaledhussain004";
        const REPO_NAME = "sports-overlay";

        // এই কোডটি গিটহাব থেকে সরাসরি ডেটা রিড করবে
        async function loadData() {
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                const fileData = await res.json();
                document.getElementById('status').innerText = "✓ Connected to GitHub Cloud!";
            } catch (e) { 
                document.getElementById('status').innerText = "Error: Check repo name!"; 
            }
        }
        loadData();
    </script>
